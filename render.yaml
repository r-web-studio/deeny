{
  "$schema": "https://raw.githubusercontent.com/render-com/render/main/schema/render.schema.json",
  "services": [
    {
      "type": "web",
      "name": "deenflow",
      "runtime": "node",
      "plan": "starter",
      "buildCommand": "npm install && npm run build",
      "startCommand": "npm run start",
      "autoDeploy": true,
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "20"
        },
        {
          "key": "NEXT_PUBLIC_SUPABASE_URL",
          "sync": false
        },
        {
          "key": "NEXT_PUBLIC_SUPABASE_ANON_KEY",
          "sync": false
        },
        {
          "key": "OPENROUTER_API_KEY",
          "sync": false
        }
      ],
      "healthCheckPath": "/api/health"
    },
    {
      "type": "web",
      "name": "deenflow-bot",
      "runtime": "node",
      "plan": "starter",
      "buildCommand": "cd telegram-bot && npm install && npx tsc",
      "startCommand": "cd telegram-bot && node dist/index.js",
      "autoDeploy": true,
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "20"
        },
        {
          "key": "BOT_TOKEN",
          "sync": false
        },
        {
          "key": "ADMIN_PASSWORD",
          "sync": false
        },
        {
          "key": "ADMIN_CHAT_ID",
          "sync": false
        }
      ],
      "healthCheckPath": "/"
    }
  ]
}
